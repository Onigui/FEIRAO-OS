name: API CI

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'

defaults:
  run:
    working-directory: apps/api

jobs:
  ci:
    name: lint · test · e2e · build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autopilot
          POSTGRES_PASSWORD: autopilot
          POSTGRES_DB: autopilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autopilot -d autopilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://autopilot:autopilot@localhost:5432/autopilot?schema=public
      DATABASE_URL_PLAIN: postgresql://autopilot:autopilot@localhost:5432/autopilot
      JWT_ACCESS_SECRET: ci-test-jwt-access-secret-32chars
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      SWAGGER_ENABLED: 'false'
      SEED_PROFILE: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci --forceExit

      - name: Migrate database
        run: npx prisma migrate deploy

      - name: Seed test fixtures
        run: npm run seed:test

      # Vitrine e Feirões: migrations são escritas à mão (padrão do repo).
      # Falha se o Prisma ainda quiser mudar objetos da Vitrine/Feirões no banco migrado.
      - name: Prisma drift (Vitrine e Feirões)
        run: bash scripts/check-vitrine-drift.sh

      - name: E2E tests
        # Serial: suites share seeded users; auth logout-all would race parallel workers.
        run: npm run test:e2e -- --ci --forceExit --runInBand --reporters=default --reporters=github-actions

      - name: Seed da demonstração (Vitrine e Feirões) — roda 2x para provar que é idempotente
        run: |
          npm run seed:vitrine
          npm run seed:vitrine | tee /tmp/seed.log
          grep -q '"vehicles": 120' /tmp/seed.log
          grep -q '"fairVehicles": 80' /tmp/seed.log

      - name: Backup e restauração (mesmo processo do db-backup.yml)
        run: |
          set -e
          trap 'echo "::error title=backup::$(tail -c 2000 /tmp/backup.err | tr "\n" " ")"' ERR
          exec 2> >(tee /tmp/backup.err >&2)
          pg_dump --version; psql --version
          pg_dump "$DATABASE_URL_PLAIN" -Fc --no-owner --no-privileges -f /tmp/b.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase ci-pass --symmetric --cipher-algo AES256 -o /tmp/b.dump.gpg /tmp/b.dump
          rm /tmp/b.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase ci-pass -o /tmp/r.dump -d /tmp/b.dump.gpg
          psql "$DATABASE_URL_PLAIN" -c "DROP DATABASE IF EXISTS restore_check" -c "CREATE DATABASE restore_check"
          # Cliente mais novo que o servidor do CI (16) emite "SET transaction_timeout", que o 16
          # não conhece; esse único aviso é aceito. Qualquer outro erro falha o passo.
          pg_restore --no-owner --no-privileges -d "${DATABASE_URL_PLAIN%/*}/restore_check" /tmp/r.dump 2> /tmp/restore.err || true
          cat /tmp/restore.err
          if grep -v -e 'transaction_timeout' -e 'errors ignored on restore' -e '^Command was' /tmp/restore.err | grep -q .; then
            exit 1
          fi
          n=$(psql "${DATABASE_URL_PLAIN%/*}/restore_check" -tAc "SELECT count(*) FROM vehicles")
          echo "carros restaurados: $n"
          test "$n" -ge 120

      - name: Build
        run: npm run build

      # O mesmo Dockerfile que o Render usa: constrói e sobe a imagem contra o Postgres/Redis do CI.
      - name: Imagem Docker (build + subir + /health)
        run: |
          docker build -t autopilot-api:ci .
          docker run -d --name api-ci --network host \
            -e NODE_ENV=production -e PORT=3099 \
            -e DATABASE_URL="$DATABASE_URL" -e DB_ALLOW_BYPASS_ROLE=true \
            -e REDIS_HOST=localhost -e REDIS_PORT=6379 \
            -e JWT_ACCESS_SECRET=ci-docker-smoke-secret-with-32-chars-min \
            autopilot-api:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3099/health/live && break
            sleep 1
          done
          curl -fsS http://localhost:3099/health/ready || (docker logs api-ci; exit 1)
          curl -fsS "http://localhost:3099/api/public/vehicles?limit=1" >/dev/null || (docker logs api-ci; exit 1)
          docker rm -f api-ci
